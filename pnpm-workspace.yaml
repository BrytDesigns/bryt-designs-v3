packages:
  - apps/*
  - packages/*

# Versions shared across workspaces, or that must move together. Solid in
# particular must resolve to a single copy, or components from packages/ui won't
# share the app's reactive runtime.
catalog:
  # Each @effect/* release peers on effect at the same minor, so these stay on
  # effect's minor and move with it.
  "@effect/graphql-generator": ~4.0.7
  "@effect/platform-node": ~4.0.7
  "@effect/vitest": ~4.0.7
  "@solidjs/web": 2.0.0-rc.19
  "@tailwindcss/vite": ^4.3.3
  effect: ^4.0.7
  solid-js: 2.0.0-rc.19
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vitest: ^5.0.5

# CLAUDE.md and the symlinked skills in .claude/skills read docs out of these
# packages at the root node_modules, though only workspaces depend on them.
publicHoistPattern:
  - solid-js
  - "@solidjs/web"
  - "@solidjs/diagnostics"

onlyBuiltDependencies:
  - workerd

peerDependencyRules:
  allowedVersions:
    # @kobalte/core@2.0.0-alpha.4 pins its Solid peers to exactly 2.0.0-rc.16.
    # rc.17-rc.19 are patch releases, and Kobalte ships JSX source that our
    # compiler builds. Remove these once Kobalte publishes an alpha for the current RC.
    "@kobalte/core>solid-js": "2.0.0-rc.19"
    "@kobalte/core>@solidjs/web": "2.0.0-rc.19"
    "@kobalte/utils>solid-js": "2.0.0-rc.19"
    "@kobalte/utils>@solidjs/web": "2.0.0-rc.19"
    # capnp-es (via @alchemy.run/cloudflare-runtime) only loads typescript in its
    # codegen compiler, which Alchemy never imports.
    "capnp-es>typescript": "7"
